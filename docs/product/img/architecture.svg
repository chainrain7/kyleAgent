<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 624" role="img" aria-label="kyleAgent runtime architecture">
  <style>
    svg {
      --fg: #18181b;
      --sub: #52525b;
      --faint: #71717a;
      --card: #ffffff;
      --nested: #f9f9fa;
      --border: rgba(0, 0, 0, 0.10);
      --border-strong: rgba(0, 0, 0, 0.18);
      --dot: rgba(0, 0, 0, 0.05);
      --info: #2563eb;  --info-soft: rgba(37, 99, 235, 0.08);
      --ok: #16a34a;    --ok-soft: rgba(22, 163, 74, 0.08);
      --warn: #b45309;  --warn-soft: rgba(180, 83, 9, 0.08);
      --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fg: #f4f4f5;
        --sub: #a1a1aa;
        --faint: #8b8b93;
        --card: #17171b;
        --nested: #1f1f24;
        --border: rgba(255, 255, 255, 0.09);
        --border-strong: rgba(255, 255, 255, 0.20);
        --dot: rgba(255, 255, 255, 0.05);
        --info: #60a5fa;  --info-soft: rgba(96, 165, 250, 0.10);
        --ok: #22c55e;    --ok-soft: rgba(34, 197, 94, 0.10);
        --warn: #f59e0b;  --warn-soft: rgba(245, 158, 11, 0.10);
        --err: #ef4444;
      }
    }
    text { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace; }
    .card   { fill: var(--card);   stroke: var(--border-strong); stroke-width: 1; }
    .nested { fill: var(--nested); stroke: var(--border); stroke-width: 1; }
    .divider { stroke: var(--border); stroke-width: 1; }
    .t-kicker { fill: var(--info); font-size: 10.5px; font-weight: 600; letter-spacing: 2.4px; }
    .t-title  { fill: var(--fg); font-size: 20px; font-weight: 650; }
    .t-legend { fill: var(--sub); font-size: 11px; }
    .t-name   { fill: var(--fg); font-size: 13px; font-weight: 650; }
    .t-desc   { fill: var(--sub); font-size: 11px; }
    .t-desc2  { fill: var(--faint); font-size: 10px; }
    .t-ribbon { fill: var(--fg); font-size: 12.5px; font-weight: 600; }
    .t-side   { fill: var(--sub); font-size: 10.5px; }
    .t-mini-title { fill: var(--fg); font-size: 11px; font-weight: 640; }
    .t-mini-desc  { fill: var(--sub); font-size: 9.5px; }
    .t-out-title  { fill: var(--fg); font-size: 11.5px; font-weight: 650; }
    .t-out-desc   { fill: var(--sub); font-size: 10px; }
    .t-chip   { fill: var(--fg); font-size: 11px; font-weight: 600; }
    .t-chiparrow { fill: var(--faint); font-size: 11px; }
    .t-looplabel { fill: var(--faint); font-size: 9.5px; }
    .t-footer { fill: var(--faint); font-size: 10px; }
    .ribbon  { fill: var(--info-soft); stroke: var(--info); stroke-width: 1; stroke-opacity: 0.35; }
    .chip    { fill: var(--info-soft); stroke: var(--info); stroke-width: 0.8; stroke-opacity: 0.45; }
    .pill    { fill: none; stroke: var(--info); stroke-width: 0.9; stroke-opacity: 0.6; }
    .t-pill  { fill: var(--info); font-size: 10px; font-weight: 600; }
    .arr-info  { stroke: var(--info); stroke-width: 1.3; fill: none; }
    .arr-ok    { stroke: var(--ok); stroke-width: 1.3; fill: none; }
    .arr-warn  { stroke: var(--warn); stroke-width: 1.3; fill: none; }
    .arr-loop  { stroke: var(--faint); stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    .mk-info { fill: var(--info); }
    .mk-ok   { fill: var(--ok); }
    .mk-warn { fill: var(--warn); }
    .mk-sub  { fill: var(--faint); }
    .lg-info { fill: var(--info); }
    .lg-ok   { fill: var(--ok); }
    .lg-warn { fill: var(--warn); }
    .lg-err  { fill: var(--err); }
    .dotgrid { fill: url(#dotgrid); }
    .dotfill { fill: var(--dot); }
  </style>
  <defs>
    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" class="dotfill"/>
    </pattern>
    <marker id="m-info" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="mk-info"/>
    </marker>
    <marker id="m-ok" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="mk-ok"/>
    </marker>
    <marker id="m-warn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="mk-warn"/>
    </marker>
    <marker id="m-sub" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="mk-sub"/>
    </marker>
  </defs>

  <!-- 背景点阵 -->
  <rect x="0" y="0" width="920" height="624" class="dotgrid"/>

  <!-- ── 头部 ── -->
  <g class="layer" data-layer="header">
    <text x="28" y="36" class="mono t-kicker">KYLEAGENT RUNTIME</text>
    <text x="28" y="62" class="t-title">自研 Agent 运行时架构</text>
    <circle cx="622" cy="32" r="3" class="lg-info"/>
    <text x="634" y="36" class="t-legend">协议通道</text>
    <circle cx="704" cy="32" r="3" class="lg-ok"/>
    <text x="716" y="36" class="t-legend">事件流</text>
    <circle cx="770" cy="32" r="3" class="lg-warn"/>
    <text x="782" y="36" class="t-legend">持久化</text>
    <circle cx="838" cy="32" r="3" class="lg-err"/>
    <text x="850" y="36" class="t-legend">权限审批</text>
  </g>

  <!-- ── 客户端层 ── -->
  <g class="layer" data-layer="clients">
    <rect x="28"  y="84" width="272" height="68" rx="10" class="card"/>
    <text x="42" y="108" class="mono t-name">kyle</text>
    <text x="42" y="128" class="t-desc">一次性任务与脚本化验证</text>
    <text x="42" y="144" class="mono t-desc2">chat · run · ping · trace</text>

    <rect x="324" y="84" width="272" height="68" rx="10" class="card"/>
    <text x="338" y="108" class="mono t-name">kyle-tui</text>
    <rect x="410" y="95" width="46" height="17" rx="8.5" class="pill"/>
    <text x="433" y="107" text-anchor="middle" class="t-pill">主前端</text>
    <text x="338" y="128" class="t-desc">Textual 终端 UI</text>
    <text x="338" y="144" class="t-desc">实时流 · 工具卡 · 审批卡</text>

    <rect x="620" y="84" width="272" height="68" rx="10" class="card"/>
    <text x="634" y="108" class="mono t-name">kyle-webui</text>
    <rect x="724" y="95" width="48" height="17" rx="8.5" class="pill"/>
    <text x="748" y="107" text-anchor="middle" class="t-pill">浏览器</text>
    <text x="634" y="128" class="t-desc">Web Console · React 单页</text>
    <text x="634" y="144" class="mono t-desc2">WS ↔ TCP 桥接 · :8080</text>

    <line x1="164" y1="152" x2="164" y2="168" class="arr-info" marker-end="url(#m-info)"/>
    <line x1="460" y1="152" x2="460" y2="168" class="arr-info" marker-end="url(#m-info)"/>
    <line x1="756" y1="152" x2="756" y2="168" class="arr-info" marker-end="url(#m-info)"/>
  </g>

  <!-- ── 协议总线 ── -->
  <g class="layer" data-layer="protocol">
    <rect x="28" y="172" width="864" height="34" rx="8" class="ribbon"/>
    <text x="44"  y="193" class="t-side">请求 →</text>
    <text x="460" y="194" text-anchor="middle" class="mono t-ribbon">JSON-RPC 2.0 · NDJSON over TCP · 127.0.0.1:7437</text>
    <text x="876" y="193" text-anchor="end" class="t-side">← 事件推送</text>
    <line x1="460" y1="206" x2="460" y2="224" class="arr-info" marker-end="url(#m-info)"/>
  </g>

  <!-- ── daemon ── -->
  <g class="layer" data-layer="daemon">
    <rect x="28" y="228" width="864" height="244" rx="12" class="card"/>
    <text x="48"  y="255" class="mono t-name" font-size="13.5">kyle-core</text>
    <text x="152" y="255" class="t-desc">常驻 daemon · 单进程 · 多客户端共享会话与权限</text>
    <line x1="412" y1="270" x2="412" y2="456" class="divider"/>

    <rect x="48" y="272" width="340" height="54" rx="9" class="nested"/>
    <text x="62" y="293" class="mono t-mini-title" font-size="12">AgentRunner</text>
    <text x="62" y="312" class="t-mini-desc" font-size="10">每次 run 组装 loop · context · tools · policy</text>
    <line x1="218" y1="326" x2="218" y2="343" class="arr-info" marker-end="url(#m-info)"/>

    <rect x="48" y="348" width="340" height="110" rx="9" class="nested"/>
    <text x="62" y="369" class="mono t-mini-title" font-size="12">AgentLoop</text>
    <rect x="158" y="356" width="62" height="17" rx="8.5" class="pill"/>
    <text x="189" y="368" text-anchor="middle" class="t-pill">ReAct</text>

    <rect x="62"  y="380" width="92" height="26" rx="13" class="chip"/>
    <text x="108" y="397" text-anchor="middle" class="t-chip">LLM 思考</text>
    <text x="161" y="397" text-anchor="middle" class="t-chiparrow">→</text>
    <rect x="166" y="380" width="92" height="26" rx="13" class="chip"/>
    <text x="212" y="397" text-anchor="middle" class="t-chip">工具调用</text>
    <text x="265" y="397" text-anchor="middle" class="t-chiparrow">→</text>
    <rect x="270" y="380" width="92" height="26" rx="13" class="chip"/>
    <text x="316" y="397" text-anchor="middle" class="t-chip">结果回填</text>

    <path d="M 316 411 v 12 h -208 v -10" class="arr-loop" marker-end="url(#m-sub)"/>
    <text x="212" y="438" text-anchor="middle" class="t-looplabel">循环直至 end_turn / max_steps</text>

    <rect x="428" y="272" width="144" height="88" rx="9" class="nested"/>
    <text x="440" y="292" class="t-mini-title">LLM Provider</text>
    <text x="440" y="310" class="t-mini-desc">流式 + prompt caching</text>
    <text x="440" y="324" class="t-mini-desc">Anthropic / OpenAI 兼容</text>

    <rect x="580" y="272" width="144" height="88" rx="9" class="nested"/>
    <text x="592" y="292" class="t-mini-title">Tool Registry</text>
    <text x="592" y="310" class="t-mini-desc">pydantic 参数校验</text>
    <text x="592" y="324" class="t-mini-desc">只读并发 · 变更串行</text>

    <rect x="732" y="272" width="144" height="88" rx="9" class="nested"/>
    <text x="742" y="292" class="t-mini-title">Permissions</text>
    <text x="742" y="310" class="t-mini-desc">多层策略评估</text>
    <text x="742" y="324" class="t-mini-desc">审批卡 · ASK 兜底</text>

    <rect x="428" y="368" width="144" height="88" rx="9" class="nested"/>
    <text x="440" y="388" class="t-mini-title">EventBus</text>
    <text x="440" y="406" class="t-mini-desc">结构化事件发布</text>
    <text x="440" y="420" class="t-mini-desc">订阅推送 · 落盘</text>

    <rect x="580" y="368" width="144" height="88" rx="9" class="nested"/>
    <text x="592" y="388" class="t-mini-title">SessionStore</text>
    <text x="592" y="406" class="t-mini-desc">thread / notes / meta</text>
    <text x="592" y="420" class="t-mini-desc">断线重连恢复现场</text>

    <rect x="732" y="368" width="144" height="88" rx="9" class="nested"/>
    <text x="742" y="388" class="t-mini-title">Compactor</text>
    <text x="742" y="406" class="t-mini-desc">token 水位自动压缩</text>
    <text x="742" y="420" class="t-mini-desc">tool_result 截断</text>
  </g>

  <!-- ── 外部产出 ── -->
  <g class="layer" data-layer="outputs">
    <line x1="130" y1="472" x2="130" y2="490" class="arr-info" marker-end="url(#m-info)"/>
    <line x1="350" y1="472" x2="350" y2="490" class="arr-ok"   marker-end="url(#m-ok)"/>
    <line x1="570" y1="472" x2="570" y2="490" class="arr-warn" marker-end="url(#m-warn)"/>
    <line x1="790" y1="472" x2="790" y2="490" class="arr-warn" marker-end="url(#m-warn)"/>

    <rect x="28" y="494" width="204" height="76" rx="9" class="nested"/>
    <circle cx="44" cy="514" r="3.5" class="lg-info"/>
    <text x="54" y="518" class="t-out-title">MCP Servers</text>
    <text x="42" y="538" class="t-out-desc">stdio / TCP 双传输</text>
    <text x="42" y="554" class="t-out-desc">启动自动发现工具</text>

    <rect x="248" y="494" width="204" height="76" rx="9" class="nested"/>
    <circle cx="264" cy="514" r="3.5" class="lg-ok"/>
    <text x="274" y="518" class="mono t-out-title">events.jsonl</text>
    <text x="262" y="538" class="t-out-desc">runs/&lt;run_id&gt;/ 逐事件落盘</text>
    <text x="262" y="554" class="t-out-desc">TUI · Console 实时渲染</text>

    <rect x="468" y="494" width="204" height="76" rx="9" class="nested"/>
    <circle cx="484" cy="514" r="3.5" class="lg-warn"/>
    <text x="494" y="518" class="t-out-title">TraceWriter</text>
    <text x="482" y="538" class="mono t-out-desc" font-size="9.5">~/.kyle/traces/daemon.jsonl</text>
    <text x="482" y="554" class="t-out-desc">IPC · 总线 · LLM 三层回放</text>

    <rect x="688" y="494" width="204" height="76" rx="9" class="nested"/>
    <circle cx="704" cy="514" r="3.5" class="lg-warn"/>
    <text x="714" y="518" class="mono t-out-title">policy.toml</text>
    <text x="702" y="538" class="mono t-out-desc" font-size="9.5">~/.kyle/policy.toml</text>
    <text x="702" y="554" class="t-out-desc">审批缓存与永久策略落盘</text>

    <text x="28"  y="600" class="mono t-footer">Python 3.12 · 零框架自研 · Web Console 构建产物入库 CI 零 Node</text>
    <text x="892" y="600" text-anchor="end" class="mono t-footer">持久状态 ~/.kyle/ : memory.db · knowledge/ · sessions/ · traces/</text>
  </g>
</svg>
