<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnCallCopilot</title>
<script>
/* 主题预设:localStorage 优先,否则跟随系统;须在 CSS 生效前设好 data-theme 防闪屏 */
(function () {
  try {
    var t = localStorage.getItem("kyle.theme");
    var dark = t ? t === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
})();
</script>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c1c20'/%3E%3Crect x='.5' y='.5' width='31' height='31' rx='8.5' fill='none' stroke='rgba(255,255,255,.16)'/%3E%3Cpath d='M11 8v16M11 16l10-8M11 16l10 8' stroke='%23f4f4f5' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#1c1c20"/>
        <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="none" stroke="rgba(255,255,255,0.16)"/>
        <path d="M11 8v16M11 16l10-8M11 16l10 8" stroke="#f4f4f5" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="brand-name">OnCallCopilot</span>
      <span class="brand-div"></span>
      <span id="envChip" class="env-chip hidden">
        <span class="edot"></span><span id="envChipText">环境获取中…</span>
      </span>
    </div>
    <div class="top-status">
      <button id="themeToggle" class="theme-toggle" title="切换亮/暗色" aria-label="切换亮色/暗色主题">
        <svg class="ico-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
      </button>
      <div id="meter" class="meter hidden" title="上下文水位">
        <div class="meter-bar"><i id="meterFill"></i></div>
        <span id="meterLabel" class="meter-val">ctx 0%</span>
      </div>
      <span id="hitChip" class="chip hidden" title="prompt 缓存命中率"></span>
      <span class="conn-wrap">
        <span id="connDot" class="conn connecting"></span>
        <span id="connText" class="conn-text">connecting</span>
      </span>
    </div>
  </header>

  <div id="shell">

    <aside id="sidebar">
      <button id="btnNew" class="btn-new">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新会话
      </button>

      <div id="drillRow" class="drill-row hidden">
        <button id="btnDrill" class="btn-drill">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
          故障演练 ▾
        </button>
        <button id="btnDrillReset" class="btn-drill ghost" title="重置环境">↺</button>
      </div>
      <div id="drillMenu" class="drill-menu hidden"></div>

      <section id="alertsSec" class="side-sec hidden">
        <div class="sec-label">告警队列 <span id="alertCount" class="count-badge zero">0</span></div>
        <div id="alertList" class="alert-list"></div>
      </section>

      <section id="healthSec" class="side-sec hidden">
        <div class="sec-label">服务健康</div>
        <div id="svcList"></div>
      </section>

      <section id="reportsSec" class="side-sec hidden">
        <div class="sec-label">处置报告</div>
        <div id="reportList"></div>
      </section>

      <section class="side-sec">
        <div class="sec-label">会话</div>
        <div class="side-kv"><span>状态</span>
          <span id="sessionState" class="state-pill waiting">
            <span class="sdot"></span><span id="sessionStateText">—</span>
          </span>
        </div>
        <div class="side-actions">
          <button id="btnCompact" class="side-btn" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h16M10 4 8 9M14 20l2-5"/></svg>
            压缩上下文
          </button>
          <button id="btnClose" class="side-btn danger" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            关闭会话
          </button>
        </div>
      </section>

      <footer class="side-foot">
        <div class="foot-row"><span>daemon</span><span id="coreAddr" class="mono">127.0.0.1:7437</span></div>
        <div class="foot-row"><span>session</span><b id="sessionId" class="mono">—</b></div>
      </footer>
    </aside>

    <main id="main">
      <div id="banner" class="banner hidden"></div>
      <div id="scroller">
        <div id="transcript">

          <div id="hero">
            <div class="hero-greet" id="heroGreet">—</div>
            <h1 class="hero-title">值班台已就绪</h1>
            <p class="hero-env" id="heroEnv">
              <span class="env-dot"></span><span id="heroEnvText">正在获取环境快照…</span>
            </p>
            <div class="hero-grid">
              <button class="hero-card" data-prompt="阅读 README.md 并用三句话总结这个项目">
                <span class="hc-ico">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                </span>
                <span class="hc-title">总结当前项目</span>
                <span class="hc-desc">阅读 README,三句话讲清这个项目是做什么的</span>
              </button>
              <button class="hero-card" data-prompt="列出 src 目录结构,指出最核心的三个模块">
                <span class="hc-ico">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </span>
                <span class="hc-title">梳理代码结构</span>
                <span class="hc-desc">扫一遍源码目录,标出最核心的三个模块</span>
              </button>
              <button class="hero-card" data-prompt="把 hello.txt 的内容改成 kyle rulez 并确认写入成功">
                <span class="hc-ico">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
                </span>
                <span class="hc-title">试一次文件写入</span>
                <span class="hc-desc">修改 hello.txt,体验工具审批与执行回执</span>
              </button>
              <button class="hero-card" data-prompt="检查当前各服务健康状态与告警队列,输出一份值班交接摘要(现状/风险/建议关注点)">
                <span class="hc-ico">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </span>
                <span class="hc-title">值班交接摘要</span>
                <span class="hc-desc">盘点服务健康与告警,生成交接要点</span>
              </button>
            </div>
          </div>

        </div>
      </div>

      <div id="composerWrap">
        <div id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="给 OnCallCopilot 一个目标,或点击左侧告警发起诊断…"></textarea>
          <button id="btnSend" class="send" title="发送" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
        <div class="composer-hint"><kbd>Enter</kbd> 发送 · <kbd>⇧ Enter</kbd> 换行 · 审批时按 <kbd>y</kbd><kbd>a</kbd><kbd>n</kbd><kbd>d</kbd></div>
      </div>
    </main>

  </div>
</div>
<div id="reportOverlay" class="report-overlay hidden">
  <div class="report-sheet">
    <div class="report-bar">
      <button id="reportBack" class="report-back">← 返回对话</button>
      <b id="reportTitle">处置报告</b>
      <span id="reportMeta" class="mono"></span>
    </div>
    <div id="reportBody" class="report-body"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
<script src="/static/oncall-panel.js"></script>
</body>
</html>
