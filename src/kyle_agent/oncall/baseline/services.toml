# OnCallCopilot 模拟生产环境拓扑(baseline 模板,标准 TOML)
# env 副本由 reset 生成,勿手改

# 不可操作的外部依赖(只能诊断,不能重启/扩容)
externals = ["orders-db", "payments-db", "risk-svc"]

[[service]]
name = "gateway"
replicas = 2
depends_on = ["orders", "payments"]

[[service]]
name = "orders"
replicas = 2
depends_on = ["orders-db"]

[[service]]
name = "payments"
replicas = 3
depends_on = ["payments-db", "risk-svc"]
