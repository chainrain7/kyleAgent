name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    name: quality-gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra webui

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Mypy type check
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Integration tests
        timeout-minutes: 10
        run: uv run pytest tests/integration -q

      - name: Protocol doc sync check
        run: uv run python scripts/gen_protocol_doc.py --check
